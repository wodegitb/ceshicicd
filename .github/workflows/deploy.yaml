name: Build and Deploy
on:
  push:
    branches: [ main ]
    paths: ['app/**', '.github/workflows/deploy.yaml']
  workflow_dispatch:
env:
  IMAGE_NAME: docker.m.daocloud.io/${{ github.repository_owner }}/k8s-demo
  DEPLOYMENT: nginx-demo
  NAMESPACE: default
  CONTAINER: nginx
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          IMAGE_TAG=${IMAGE_NAME}:${GITHUB_SHA::7}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker build -t $IMAGE_TAG ./app
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: docker.m.daocloud.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image
        run: docker push ${{ env.IMAGE_TAG }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig (最小权限 SA)
        run: |
          mkdir -p $HOME/.kube
          cat > $HOME/.kube/config <<KUBECONFIG
          apiVersion: v1
          kind: Config
          clusters:
            - name: k8s
              cluster:
                server: ${{ secrets.KUBE_SERVER }}
                insecure-skip-tls-verify: true
          users:
            - name: ci-deployer
              user:
                token: ${{ secrets.KUBE_TOKEN }}
          contexts:
            - name: ci
              context: { cluster: k8s, user: ci-deployer, namespace: default }
          current-context: ci
          KUBECONFIG
          chmod 600 $HOME/.kube/config
      - name: Verify permission (最小权限验证)
        run: |
          kubectl auth can-i update deployments -n ${{ env.NAMESPACE }}
          kubectl auth can-i delete deployments -n ${{ env.NAMESPACE }} || echo "正确：无删除权限"
      - name: Record previous image
        run: |
          kubectl -n ${{ env.NAMESPACE }} get deploy ${{ env.DEPLOYMENT }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' > /tmp/prev-image
      - name: Deploy new image
        run: |
          kubectl -n ${{ env.NAMESPACE }} set image \
            deploy/${{ env.DEPLOYMENT }} ${{ env.CONTAINER }}=${{ env.IMAGE_TAG }}
      - name: Wait for rollout
        id: rollout
        continue-on-error: true
        run: kubectl -n ${{ env.NAMESPACE }} rollout status deploy/${{ env.DEPLOYMENT }} --timeout=120s
      - name: Rollback on failure
        if: steps.rollout.outcome == 'failure'
        run: |
          echo "发布失败，自动回滚"
          kubectl -n ${{ env.NAMESPACE }} rollout undo deploy/${{ env.DEPLOYMENT }}
          kubectl -n ${{ env.NAMESPACE }} rollout status deploy/${{ env.DEPLOYMENT }} --timeout=120s
          exit 1
      - name: Verify service
        if: steps.rollout.outcome == 'success'
        run: |
          kubectl -n ${{ env.NAMESPACE }} get deploy,pods -o wide
          kubectl -n ${{ env.NAMESPACE }} get endpoints ${{ env.DEPLOYMENT }}
