apiVersion: v1
kind: Pod
metadata: { name: rwx-a, namespace: default }
spec:
  containers:
    - name: app
      image: docker.m.daocloud.io/library/busybox:1.36
      command: ["sh","-c","sleep 3600"]
      volumeMounts: [{ name: d, mountPath: /data }]
  volumes:
    - name: d
      persistentVolumeClaim: { claimName: pvc-dynamic }
