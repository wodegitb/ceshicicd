apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-demo
  labels: { type: local }
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain    # Retain：删 PVC 后 PV 和数据都保留
  storageClassName: manual                 # ★ 必须和 PVC 一致
  hostPath:
    path: /data/k8s/pv-demo
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-demo
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 500Mi
