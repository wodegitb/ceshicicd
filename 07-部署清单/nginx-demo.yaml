apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: default
  labels: { app: nginx-demo }
spec:
  replicas: 2
  revisionHistoryLimit: 5              # 保留 5 个历史版本，方便回滚
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                      # 最多多起 1 个
      maxUnavailable: 0                # 最多 0 个不可用 —— 发布失败服务不中断
  selector:
    matchLabels: { app: nginx-demo }
  template:
    metadata:
      labels: { app: nginx-demo }
    spec:
      containers:
        - name: nginx
          image: docker.m.daocloud.io/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          startupProbe:                # 启动探针：给慢启动应用足够时间
            httpGet: { path: /, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:              # 就绪探针：决定"能不能接流量"
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:               # 存活探针：决定"要不要重启容器"
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: default
spec:
  type: NodePort
  selector:
    app: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: http                 # 指向容器命名端口，不写死数字
      nodePort: 30080
